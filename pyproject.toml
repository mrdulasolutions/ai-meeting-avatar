[project]
name = "ai-meeting-avatar"
version = "0.1.0"
description = "Local AI meeting avatar agent — joins calls, listens, and responds with a cloned voice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Meeting Avatar" }]

dependencies = [
    # LiveKit real-time media
    "livekit>=0.17",
    "livekit-agents>=0.8",
    # Speech-to-text
    "faster-whisper>=1.0",
    # LLM — Google AI Edge LiteRT-LM (local Gemma 4 inference, no server needed)
    "litert-lm-nightly",
    # Hugging Face Hub — download gated Gemma 4 .litertlm weights
    "huggingface-hub>=0.23",
    # TTS — Kokoro-ONNX (lightweight, no GPU, no voice samples needed)
    "kokoro-onnx>=0.5",
    "onnxruntime>=1.20",
    # Audio processing
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "av>=11.0",
    # Config & CLI
    "pydantic>=2.5",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Claude API backend — alternative to local Gemma 4
claude = [
    "anthropic>=0.40",
]
# Phase 2: avatar video rendering
avatar = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchaudio>=2.0",
    "opencv-python>=4.8",
    "face-alignment>=1.4",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]
# OBS WebSocket integration for virtual camera output
obs = [
    "obs-websocket-py>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
ai-avatar = "ai_meeting_avatar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_meeting_avatar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
