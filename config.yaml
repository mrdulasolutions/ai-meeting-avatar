# ─────────────────────────────────────────────────────────────────
# AI Meeting Avatar — Configuration
# Copy this file and edit values for your environment.
# Secrets can also be placed in .env (see .env.example).
# ─────────────────────────────────────────────────────────────────

agent:
  name: "AI Meeting Avatar"
  # Prompt injected as the system message for every conversation
  system_prompt: |
    You are a helpful AI meeting assistant attending this call on behalf of your user.
    Keep responses concise and conversational — this is a live voice call.
    Answer questions clearly and directly. Aim for 1-3 sentences unless more detail is needed.
  language: "en"
  # Seconds of silence before flushing buffered audio through the pipeline
  silence_flush_seconds: 1.0

# ── LiveKit ───────────────────────────────────────────────────────
# LiveKit is used as the real-time media transport layer.
#
# ── Local dev (Docker, same machine only) ─────────────────────────
#   url: "ws://localhost:7880"
#   api_key: "devkey"
#   api_secret: "secret"
#
#   Start server:
#     docker run --rm -d --name livekit-dev \
#       -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
#       livekit/livekit-server --dev --bind 0.0.0.0
#
# ── LiveKit Cloud (remote access, free tier available) ────────────
#   Sign up at https://cloud.livekit.io, create a project, then
#   copy the URL, API key, and secret from the dashboard.
#   Recommended: put credentials in .env rather than this file.
#
#   url: "wss://your-project.livekit.cloud"
#   api_key: ""     # set LIVEKIT_API_KEY in .env or environment
#   api_secret: ""  # set LIVEKIT_API_SECRET in .env or environment
#
livekit:
  url: "ws://localhost:7880"          # override with LIVEKIT_URL env var
  api_key: "devkey"                   # override with LIVEKIT_API_KEY env var
  api_secret: "secret"               # override with LIVEKIT_API_SECRET env var
  room: ""                            # Room name (can be passed on CLI)

# ── Speech-to-Text (Whisper) ─────────────────────────────────────
stt:
  model_size: "base"       # tiny | base | small | medium | large-v3
  device: "cpu"            # cpu | cuda | mps (Apple Silicon)
  compute_type: "int8"     # int8 | float16 | float32
  language: "en"           # ISO-639-1 language code, or "auto"
  # Energy threshold for voice-activity detection (0.0 – 1.0 scale)
  # Lower = more sensitive, higher = only loud speech triggers pipeline
  vad_energy_threshold: 0.02
  # How many consecutive silent 20ms frames end a speech segment
  silence_frames_threshold: 50       # 50 × 20ms = 1 second

# ── LLM ──────────────────────────────────────────────────────────────────────
# Two backends available — pick one:
#
#   gemma  — local Gemma 4 via LiteRT-LM (offline, private, no API key)
#   claude — Anthropic Claude API (smarter, needs ANTHROPIC_API_KEY)
#
# Switch at any time:
#   ai-avatar brain                         (interactive menu)
#   LLM_BACKEND=claude ai-avatar join room  (env override, no file edit)
llm:
  # ── Backend selection ──────────────────────────────────────────────────────
  # "gemma" | "claude"
  backend: "gemma"

  # ── Gemma (local) ──────────────────────────────────────────────────────────
  # LiteRT-LM runs Gemma 4 entirely in-process. No server required.
  # Models are .litertlm files downloaded from Hugging Face (gated).
  #
  # Model options:
  #   gemma-4-E2B  ~2.6 GB on disk, ~1.5 GB RAM with 4-bit quant  ← recommended
  #   gemma-4-E4B  ~4+ GB on disk, ~2.5 GB RAM with 4-bit quant   ← higher quality
  model_variant: "e2b"
  model_path: "./models/gemma-4-e2b/gemma-4-E2B-it.litertlm"
  fallback_model_path: "./models/gemma-4-e2b"
  hf_repo_e2b: "litert-community/gemma-4-E2B-it-litert-lm"
  hf_repo_e4b: "litert-community/gemma-4-E4B-it-litert-lm"

  # ── Claude (cloud) ─────────────────────────────────────────────────────────
  # Requires:  pip install -e ".[claude]"
  # API key:   set ANTHROPIC_API_KEY env var (preferred) or fill in below.
  anthropic_api_key: ""   # leave blank — read from ANTHROPIC_API_KEY env var
  # Model — see https://docs.anthropic.com/en/docs/about-claude/models
  claude_model: "claude-sonnet-4-6"

  # ── Shared ─────────────────────────────────────────────────────────────────
  temperature: 0.7
  max_tokens: 512
  # Whether to expose meeting-control tools (mute, unmute, etc.) to the model
  enable_tools: true
  # Keep last N turns of conversation in context
  history_turns: 10

# ── Text-to-Speech (Kokoro-ONNX) ─────────────────────────────────
# Kokoro is a lightweight 82M-parameter TTS model. Runs on CPU via
# ONNX Runtime — no GPU, no voice samples, no extra setup required.
# Models (~80 MB) download automatically on first run.
tts:
  # Voice preset — pick one from the lists below:
  #   American English (lang: en-us):
  #     af_heart   ← warm female, recommended default
  #     af_sky, af_sarah, af_nova, af_bella
  #     am_adam, am_michael
  #   British English (lang: en-gb):
  #     bf_emma, bf_isabella, bm_george, bm_lewis
  voice: "af_heart"
  speed: 1.0          # speech rate multiplier (0.5 = slow, 2.0 = fast)
  lang: "en-us"       # "en-us" or "en-gb"
  # Directory where kokoro-v1.0.onnx and voices-v1.0.bin are stored
  # setup_models.sh downloads them here automatically
  model_dir: "./models/kokoro"

# ── Avatar Rendering (Phase 2) ───────────────────────────────────
# Lip-sync video avatar from a still photo. Renders audio-driven
# talking-head video and streams it to a virtual webcam so it
# appears in Google Meet / Zoom as your camera feed.
#
# Quick start:
#   1. pip install -e ".[avatar]"
#   2. Place a front-facing photo at assets/avatar.jpg
#   3. ai-avatar avatar enable
#   4. ai-avatar join my-meeting
#
# Requires: OBS Studio installed (for pyvirtualcam backend on macOS)
# or v4l2loopback on Linux.
avatar:
  enabled: false
  # Path to a still photo of the avatar (JPG/PNG, front-facing, min 256×256)
  photo_path: "./assets/avatar.jpg"
  # Rendering engine: "sadtalker" | "liveportrait"
  #   sadtalker    — stable, well-tested, CPU-friendly (~30-120s per utterance)
  #   liveportrait — higher quality, may need more compute
  model: "sadtalker"
  sadtalker_path: "./models/SadTalker"
  liveportrait_path: "./models/LivePortrait"
  output_fps: 25
  # Face enhancer applied after rendering: "gfpgan" | "RestoreFormer" | null
  enhancer: "gfpgan"
  # Render resolution — smaller = faster. 256×256 is a good balance.
  render_width: 256
  render_height: 256
  # Virtual camera output method:
  #   "auto"         — try pyvirtualcam, fall back to OBS WebSocket
  #   "pyvirtualcam" — force pyvirtualcam (requires OBS on macOS)
  #   "obs"          — force OBS WebSocket only (see obs: section below)
  #   "none"         — render video files but don't push to any camera
  camera_output: "auto"
  # Show static avatar photo in virtual camera when not speaking
  idle_photo: true
  # PyTorch device for renderer: "cpu" | "mps" (Apple Silicon) | "cuda"
  device: "cpu"

# ── OBS Virtual Camera (Phase 2) ─────────────────────────────────
# Only needed if avatar.camera_output is "obs" or "auto" falls back.
# Requires OBS >= 28 with WebSocket server enabled (Tools → WebSocket).
obs:
  enabled: false
  host: "localhost"
  port: 4455
  password: ""
  source_name: "AI Avatar"  # OBS media source name to push frames to
